    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f3f0;
            color: #4a2c5e;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            font-size: 2rem;
            color: #7B4397;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: #7B4397;
            color: white;
        }

        .btn-primary:hover {
            background-color: #663577;
        }

        .btn-outline {
            background-color: transparent;
            color: #7B4397;
            border: 2px solid #7B4397;
        }

        .btn-outline:hover {
            background-color: #7B4397;
            color: white;
        }

            max-width: 100%;
            max-height: 100%;
            border-radius: 50%; /* opcional: mantiene la forma circular */
        }

        .title-section {
            flex: 1;
        }

        .main-title {
            font-size: 3rem;
            color: #7B4397;
            font-weight: bold;
            margin-bottom: 0.5rem;
            text-align: left;
        }

        .title-line {
            height: 4px;
            background-color: #d4c4b0;
            width: 100%;
        }

        .columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-bottom: 3rem;
        }

        .column-title {
            background-color: #c2a68a;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .column-title h3 {
            font-size: 1.8rem;
            color: #4a2c5e;
            font-weight: bold;
        }

        .step {
            margin-bottom: 1.5rem;
        }

        .step-title {
            background-color: #d4c4b0;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .step-title input {
            background: transparent;
            border: none;
            color: #7B4397;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            outline: none;
        }

        .step-title.readonly {
            color: #7B4397;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .step-description {
            padding: 0.5rem 0;
        }

        /* Estilos para los campos de entrada */
        .step-description textarea,
        .notes-content textarea,
        .patient-name-content .single-line-input {
            width: 100%;
            border: 1px solid #d4c4b0;
            border-radius: 4px;
            padding: 0.8rem;
            font-family: inherit;
            font-size: 1rem;
            background-color: white;
            color: #4a2c5e;
        }

        /* Altura específica para textareas */
        .step-description textarea,
        .notes-content textarea {
            resize: vertical;
            min-height: 100px;
            height: 120px;      /* Ajustar altura para 5 filas */
            line-height: 1.5;   /* Mejorar espaciado entre líneas */
            padding: 8px;       /* Agregar padding */
            font-family: inherit; /* Coincidir con la fuente del resto del texto */
            font-size: 1rem;    /* Tamaño de fuente consistente */
        }

        /* Asegurar que el texto se ajuste correctamente en el PDF */
        #routine-preview textarea {
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow: hidden;
        }

        /* Estilo específico para el campo de nombre de una sola línea */
        .patient-name-content .single-line-input {
            height: 40px;
            min-height: 40px;
            resize: none;
            overflow: hidden;
            padding: 0.5rem 0.8rem;
        }

        /* Estilos para el modo de solo lectura */
        .step-description.readonly textarea,
        .notes-content.readonly textarea,
        .patient-name-content.readonly .single-line-input {
            border: none;
            padding: 0.5rem;
            resize: none;
            overflow: hidden;
            background-color: transparent;
        }

        /* Ocultar el placeholder en el modo de solo lectura */
        .step-description.readonly textarea::placeholder,
        .notes-content.readonly textarea::placeholder,
        .patient-name-content.readonly .single-line-input::placeholder {
            color: transparent;
        }

        .step-description.readonly {
            color: #4a2c5e;
            min-height: 2rem;
            line-height: 1.5;
        }

        .notes-section {
            margin-top: 2rem;
        }

        .notes-title {
            background-color: #d4c4b0;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .notes-title h4 {
            color: #7B4397;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .notes-content textarea {
            min-height: 100px;
        }

        .notes-content.readonly {
            min-height: 6rem;
            line-height: 1.5;
            padding: 1rem 0;
        }

        .patient-name-section {
            margin-top: 2rem;
        }

        .patient-name-title {
            background-color: #d4c4b0;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .patient-name-title h4 {
            color: #7B4397;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .patient-name-content textarea {
            min-height: 100px;
        }

        .patient-name-content.readonly {
            min-height: 6rem;
            line-height: 1.5;
            padding: 1rem 0;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                text-align: center;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .routine-card {
                padding: 1.5rem;
            }

            .logo-title {
                flex-direction: column;
                gap: 1rem;
            }

            .main-title {
                font-size: 2rem;
            }

            .columns {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }
    </style>
</head>

            <div class="day-column">

<script>
    // Datos iniciales
    const initialData = {
        day: [
            { title: 'Limpieza', description: '' },
            { title: 'Tónico', description: '' },
            { title: 'Contorno de ojos', description: '' },
            { title: 'Serum', description: '' },
            { title: 'Hidratación', description: '' },
            { title: 'Protección', description: '' }
        ],
        night: [
            { title: 'Desmaquillante', description: '' },
            { title: 'Limpieza', description: '' },
            { title: 'Tónico', description: '' },
            { title: 'Contorno de ojos', description: '' },
            { title: 'Serum', description: '' },
            { title: 'Crema de tratamiento', description: '' },
            { title: 'Hidratación', description: '' }
        ],
        notes: '',
        patientName: ''
    };

    let isEditing = true;
    let routineData = JSON.parse(JSON.stringify(initialData));

    // Elementos del DOM
    const toggleEditBtn = document.getElementById('toggleEdit');
    const editText = document.getElementById('editText');
    const downloadBtn = document.getElementById('downloadPDF');
    const dayStepsContainer = document.getElementById('day-steps');
    const nightStepsContainer = document.getElementById('night-steps');
    const notesTextarea = document.getElementById('notes-textarea');
    const patientNameTextarea = document.getElementById('patient-name-textarea');

    // Inicializar la aplicación
    function init() {
        renderSteps();
        updateEditMode();
    }

    // Renderizar pasos
    function renderSteps() {
        renderColumn('day', dayStepsContainer, routineData.day);
        renderColumn('night', nightStepsContainer, routineData.night);
    }

    // Renderizar una columna
    function renderColumn(period, container, steps) {
        container.innerHTML = '';

        steps.forEach((step, index) => {
            const stepDiv = document.createElement('div');
            stepDiv.className = 'step';

            const readonlyClass = isEditing ? '' : 'readonly';

            stepDiv.innerHTML = `
                    <div class="step-title ${readonlyClass}">
                        <input type="text" value="${step.title}" data-period="${period}" data-index="${index}" data-field="title" ${isEditing ? '' : 'readonly'}>
                    </div>
                    <div class="step-description ${readonlyClass}">
                        <textarea data-period="${period}" data-index="${index}" data-field="description" placeholder="Descripción del producto o paso..." rows="5" ${isEditing ? '' : 'readonly'}>${step.description}</textarea>
                    </div>
                `;

            container.appendChild(stepDiv);
        });

        // Agregar event listeners si estamos en modo edición
        if (isEditing) {
            container.querySelectorAll('input, textarea').forEach(input => {
                input.addEventListener('input', handleInputChange);
            });
        }
    }

    // Manejar cambios en inputs
    function handleInputChange(e) {
        const { period, index, field } = e.target.dataset;
        const value = e.target.value;

        if (field === 'title') {
            routineData[period][parseInt(index)].title = value;
        } else if (field === 'description') {
            routineData[period][parseInt(index)].description = value;
        }
    }

    // Actualizar modo de edición
    function updateEditMode() {
        if (isEditing) {
            editText.textContent = 'Vista Previa';
            patientNameTextarea.removeAttribute('readonly');
            notesTextarea.removeAttribute('readonly');

            notesTextarea.parentElement.classList.remove('readonly');
            patientNameTextarea.parentElement.classList.remove('readonly');

            // Restaurar el texto original
            notesTextarea.value = routineData.notes;
            patientNameTextarea.value = routineData.patientName;

        } else {
            editText.textContent = 'Editar';
            patientNameTextarea.setAttribute('readonly', 'true');
            notesTextarea.setAttribute('readonly', 'true');

            notesTextarea.parentElement.classList.add('readonly');
            patientNameTextarea.parentElement.classList.add('readonly');

            // Asegurar que se muestre algo si está vacío
            if (!routineData.notes) notesTextarea.value = '---';
            if (!routineData.patientName) patientNameTextarea.value = '---';
        }

        renderSteps();
    }

    // Event listeners
    toggleEditBtn.addEventListener('click', () => {
        // Guardar datos antes de cambiar de modo
        if (isEditing) {
            routineData.notes = notesTextarea.value === '---' ? '' : notesTextarea.value;
            routineData.patientName = patientNameTextarea.value === '---' ? '' : patientNameTextarea.value;
        }

        isEditing = !isEditing;
        updateEditMode();
    });

    patientNameTextarea.addEventListener('input', (e) => {
        routineData.patientName = e.target.value;
    });

    notesTextarea.addEventListener('input', (e) => {
        routineData.notes = e.target.value;
    });

    downloadBtn.addEventListener('click', async () => {
        const containerElement = document.querySelector('.container');
        const routineCardElement = document.getElementById('routine-preview');

        // Guardar el padding original y el overflow del body
        const originalContainerPadding = containerElement.style.padding;

        // Cambiar el padding a 0 temporalmente para la captura
        containerElement.style.padding = '0';

        // Asegurar que estemos en modo vista previa para el PDF
        const wasEditing = isEditing;
        if (wasEditing) {
            routineData.notes = notesTextarea.value === '---' ? '' : notesTextarea.value;
            routineData.patientName = patientNameTextarea.value === '---' ? '' : patientNameTextarea.value;
            isEditing = false;
            updateEditMode();
        }

        try {
            // Mejorar la calidad del renderizado
            const canvas = await html2canvas(routineCardElement, {
                scale: 2.5,  // Aumentar la escala para mejor calidad
                useCORS: true,
                logging: false,
                allowTaint: true,
                backgroundColor: null,  // Fondo transparente
                imageTimeout: 15000,    // Tiempo de espera para cargar imágenes
                removeContainer: false, // No remover el contenedor
                letterRendering: true,  // Mejor renderizado de texto
                useBlob: true,          // Usar Blob para mejor rendimiento
                foreignObjectRendering: false, // Mejor compatibilidad
                onclone: (clonedDoc) => {
                    // Asegurar que los estilos se mantengan
                    const style = clonedDoc.createElement('style');
                    style.textContent = `
                            * {
                                -webkit-print-color-adjust: exact !important;
                                color-adjust: exact !important;
                                text-rendering: geometricPrecision !important;
                                shape-rendering: crispEdges !important;
                            }
                        `;
                    clonedDoc.head.appendChild(style);

                    // Preservar saltos de línea de los <textarea> en el clon antes de capturar
                    const preview = clonedDoc.getElementById('routine-preview');
                    if (preview) {
                        const textareas = preview.querySelectorAll('textarea');
                        textareas.forEach(ta => {
                            const replacement = clonedDoc.createElement('div');
                            // Ancho fluido dentro del layout clonado
                            replacement.style.width = '100%';
                            // Estilos para respetar saltos de línea y apariencia similar
                            replacement.style.whiteSpace = 'pre-wrap';
                            replacement.style.wordBreak = 'break-word';
                            replacement.style.lineHeight = '1.5';
                            replacement.style.padding = '0.8rem';
                            replacement.style.border = '1px solid #d4c4b0';
                            replacement.style.borderRadius = '4px';
                            replacement.style.background = '#ffffff';
                            replacement.style.color = '#4a2c5e';
                            replacement.style.fontFamily = 'inherit';
                            replacement.style.fontSize = '1rem';
                            // Usar el valor del textarea; si está vacío, forzar una sola línea visual
                            const value = (ta.value || '').trim();
                            if (!value || value === '---') {
                                replacement.innerHTML = '&nbsp;';
                            } else {
                                replacement.textContent = ta.value;
                            }
                            ta.parentNode.replaceChild(replacement, ta);
                        });

                        // Emparejar alturas por fila entre Día y Noche para mantener alineación
                        const daySteps = preview.querySelectorAll('#day-steps .step');
                        const nightSteps = preview.querySelectorAll('#night-steps .step');
                        const maxLen = Math.max(daySteps.length, nightSteps.length);
                        for (let i = 0; i < maxLen; i++) {
                            const dayStep = daySteps[i];
                            const nightStep = nightSteps[i];
                            if (!dayStep || !nightStep) continue;
                            const dayDesc = dayStep.querySelector('.step-description > div');
                            const nightDesc = nightStep.querySelector('.step-description > div');
                            if (!dayDesc || !nightDesc) continue;
                            const h1 = dayDesc.offsetHeight;
                            const h2 = nightDesc.offsetHeight;
                            const mh = Math.max(h1, h2);
                            dayDesc.style.minHeight = mh + 'px';
                            nightDesc.style.minHeight = mh + 'px';
                        }
                    }
                }
            });

            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');

            // Dimensiones de A4 en mm
            const pdfWidth = 210;
            const pdfHeight = 297;

            // Calcular las dimensiones de la imagen para que quepa en una página A4
            const imgWidth = canvas.width;
            const imgHeight = canvas.height;

            // Calcular la escala para que quepa en una página con margen
            const margin = 10;
            const availableWidth = pdfWidth - (margin * 2);
            const availableHeight = pdfHeight - (margin * 2);

            const scaleX = availableWidth / (imgWidth * 0.264583);
            const scaleY = availableHeight / (imgHeight * 0.264583);
            const scale = Math.min(scaleX, scaleY);

            const finalWidth = (imgWidth * 0.264583) * scale;
            const finalHeight = (imgHeight * 0.264583) * scale;

            // Centrar la imagen en la página
            const x = (pdfWidth - finalWidth) / 2;
            const y = (pdfHeight - finalHeight) / 2;

            pdf.addImage(imgData, 'PNG', x, y, finalWidth, finalHeight);

            // Obtener el nombre del paciente
            let patientName = document.getElementById('patient-name-textarea').value.trim();
            if (patientName === '---') {
                patientName = '';
            }

            // Formatear el nombre del archivo
            const fileName = patientName ? `${patientName.replace(/\s+/g, '_')}_rutina_facial.pdf` : 'rutina_facial.pdf';

            pdf.save(fileName);

        } catch (error) {
            console.error('Error generando PDF:', error);
            alert('Error al generar el PDF. Por favor, inténtalo de nuevo.');
        } finally {
            // Restaurar el padding original del contenedor
            containerElement.style.padding = originalContainerPadding;

            if (wasEditing) {
                isEditing = true;
                updateEditMode();
            }
        }
    });

    // Inicializar la aplicación
    init();
</script>
</body>
</html>
